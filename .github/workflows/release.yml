name: Release

# Tag format: <UPSTREAM_VERSION>.<n>, e.g. v2026-08.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches UPSTREAM_VERSION
        run: |
          upstream="$(cat UPSTREAM_VERSION)"
          [[ "$GITHUB_REF_NAME" == "$upstream."* ]] || { echo "Tag $GITHUB_REF_NAME must start with $upstream."; exit 1; }
      - uses: ./.github/actions/setup
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run stage
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
