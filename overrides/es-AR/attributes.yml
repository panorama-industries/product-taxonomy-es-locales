      description: "Describe la construcción de la cama elástica, como sin resortes o con resortes helicoidales."
    trampoline_enclosure_type:
      name: "Tipo de cerramiento para cama elástica"
      description: "Especifica la configuración del cerramiento utilizado en la cama elástica, incluyendo cómo y dónde está montada la red."
    trampoline_safety_certifications:
      description: "Indica con qué normas/certificaciones de seguridad relevantes para camas elásticas afirma cumplir el producto."
    trash_can_features:
      name: "Características del tacho de basura"
      description: "Describe características especiales de los tachos de basura, como el control de olores o el pedal."
    travel_trailer_appliances_fuel_type:
      name: "Tipo de combustible de los electrodomésticos del tráiler de viaje"
    travel_trailer_holding_tank_type:
      name: "Tipo de tanque de retención para tráileres de viaje"
      description: "Indica qué tanques de retención están presentes en el tráiler de viaje (seleccionar todos los que correspondan)."
    travel_trailer_power_hookup_shore_power:
      name: "Conexión eléctrica para tráileres de viaje (conexión a la red eléctrica)"
    trimmer_line_feed_system:
      name: "Sistema de alimentación de hilo de la bordeadora"
      description: "Identifica cómo avanza el hilo de corte desde el cabezal durante la operación."
    trimmer_line_shape:
      name: "Forma del hilo de la bordeadora"
      description: "Describe la forma transversal del hilo de la bordeadora, lo que influye en el rendimiento del corte y el ruido."
    trunk_part_type:
      name: "Tipo de pieza del baúl"
      description: "Especifica qué componente de la carrocería relacionado con el baúl se está vendiendo (por ejemplo, tapa del baúl, bisagra, pestillo)."
    turntable_type:
      description: "Identifica el estilo de la superficie de cocción, distinguiendo entre los platos giratorios tradicionales de vidrio y los diseños planos o no giratorios."
    twill_direction:
      description: "Indica la dirección de la línea de sarga de un tejido de jean."
    uk_cup_size:
      description: "Especifica la talla de copa de corpiños del Reino Unido, como C o FF."
    underwear_pieces_included:
      description: "Identifica qué piezas de la prenda se proporcionan (parte superior, parte inferior, ambas o un enterito de una sola pieza) para que el cliente sepa si está comprando un conjunto completo o un artículo individual."
    urinal_mounting_type:
      name: "Tipo de montaje del mingitorio"
      description: "Especifica cómo se instala el mingitorio, como, por ejemplo, montado en la pared o en el piso."
    us_cup_size:
      description: "Especifica la talla de copa de corpiños de EE. UU., como C o DDD."
    usage_conditions:
      description: "Especifica si el producto es adecuado para el uso en condiciones secas o húmedas, normalmente para afeitadoras."
    uv_protection:
      description: "Especifica la capacidad del producto para bloquear los rayos UV, normalmente anteojos de sol, como, por ejemplo, UV400."
    van_type:
      name: "Tipo de furgón"
      description: "Distingue entre diferentes tipos de furgones, como furgón de pasajeros o furgón transformado."
    varnish_transparency_tint:
      description: "Describe si el barniz es transparente o con tinte y, en caso de tener tinte, la gama general de tonos."
    vehicle_coaxial_speaker_nominal_size:
      name: "Tamaño nominal del parlante coaxial para vehículos"
      description: "Tamaño nominal del parlante utilizado en la instalación (por ejemplo, 6,5 pulgadas, 6x9 pulgadas)."
    vehicle_equipment_fit_out_level:
      description: "Indica el nivel de equipamiento policial incluido en el furgón."
    vehicle_glass_cleaner_form:
      name: "Formato del limpiavidrios para vehículos"
      description: "Formato físico del producto limpiavidrios para vehículos (por ejemplo, spray, espuma, toallitas, gel, concentrado)."
    vehicle_mirror_glass_type:
      description: "Especifica el tipo óptico/forma de la superficie del vidrio del espejo."
    vestibule_type:
      description: "Clasifica el diseño del vestíbulo en relación con la carpa."
    video_codecs/formats_supported:
      description: "Define los códecs de video y los formatos que admite un dispositivo, como MP4 o H.264."
    video_port_type:
      description: "Especifica el tipo de puerto de video que admite un producto, por ejemplo, HDMI o puerto de pantalla."
    vodka_base_ingredient:
      description: "Ingrediente agrícola principal a partir del cual se destila el vodka (por ejemplo, trigo, papa, maíz)."
    wader_foot_type:
      description: "Especifica si los vadeadores tienen botas integradas o medias separadas."
    waffle_style:
      name: "Estilo waffle"
      description: "Identifica la rejilla o patrón de waffle producido por las placas."
    wall_decal_style:
      description: "Especifica cómo se produce/aplica el vinilo decorativo (por ejemplo, troquelado, de transferencia, en hoja de stickers)."
    wallet_features:
      name: "Características de la billetera"
      description: "Describe características especiales de las billeteras, como la protección RFID o el diseño compacto."
    wan_interface_type:
      description: "Especifica el tipo de conexión física utilizada para el enlace ascendente WAN/Internet del router (p. ej., Ethernet, fibra, DSL, celular)"
    warmth_level:
      description: "Clasifica el nivel general de calidez o la idoneidad estacional del acolchado o la colcha."
    washer/dryer_features:
      name: "Características del lavarropas/secarropas"
    washing_machine_features:
      name: "Características del lavarropas"
      description: "Identifica funciones especiales de un lavarropas, como el bloqueo para niños o el temporizador de inicio retardado."
    washing_programs:
      description: "Define los diferentes ciclos de lavado que ofrece un lavarropas, como el lavado en frío o delicado."
    water_dispensing_mechanism:
      description: "Define cómo se libera el agua de la unidad, por ejemplo, mediante canillas, boquillas pulverizadoras o vertido por gravedad."
    water_polo_competition_approval:
      description: "Identifica el organismo rector o el nivel de competición para el que la pelota está oficialmente aprobada o certificada."
    water_polo_goal_type:
      name: "Tipo de arco de waterpolo"
      description: "Clasifica la configuración estructural o de montaje del arco (por ejemplo, flotante, montado sobre cubierta, portátil)."
    webcam_design:
      description: "Identifica el tipo de cámara web, como de conferencia, de notebook o plug-and-play."
    weight_plate_style:
      description: "Clasifica el diseño/tipo de la placa de peso (por ejemplo, olímpica, bumper, con selector) para un filtrado rápido de compatibilidad."
    wetsuit_entry_system:
      description: "Describe el tipo y ubicación del sistema de apertura/cierre utilizado para acceder al traje de neopreno."
    wheel_brake_type:
      description: "Detalla la configuración de frenado proporcionada en las ruedas o rueditas del carrito."
    wheel_hardness:
      description: "Especifica el nivel de dureza de las ruedas de la patineta, por ejemplo, 75A."
    wheel_hub_placement:
      description: "Especifica la posición del cubo de rueda de patinetas, como en el centro o desplazada."
    wheel_tread_style:
      description: "Especifica el diseño de la banda de rodadura de la rueda, que afecta a la tracción, al nivel de ruido y a las posibles marcas en el piso."
    whipped_cream_base:
      description: "Identifica el ingrediente base principal utilizado para elaborar la crema batida, como por ejemplo la crema de leche o el coco."
    whipped_cream_form:
      name: "Forma de la crema batida"
      description: "Indica el formato físico en el que se vende la crema batida."
    window_component_location:
      description: "Especifica a qué ventana/abertura dentro del vehículo se aplica la pieza (por ejemplo, parabrisas, vidrio de la puerta, luneta trasera o vidrio del cuarto delantero)."
    window_glass_features:
      description: "Indica si el vidrio ayuda a integrar tecnologías del vehículo (por ejemplo, sensor de lluvia, soporte para cámara)."
    window_glass_tint_level:
      name: "Nivel de polarizado del vidrio de la ventana"
      description: "Indica el grado aproximado de oscurecimiento de fábrica/polarizado de privacidad del vidrio de la ventana (no se refiere a láminas instaladas postventa). Usá los niveles descriptivos cuando no se conozca el VLT exacto."
    windshield_coverage_area:
      description: "Especifica qué partes del exterior delantero del vehículo está diseñado para proteger la cubierta del parabrisas (por ejemplo, solo el parabrisas o incluye limpiaparabrisas, espejos, ventanas laterales o el borde del capot)."
    wiper_blade_rubber_material:
      description: "Material del elemento de limpieza (inserto/recambio) que entra en contacto con el vidrio."
    wire_construction_type:
      description: "Especifica la construcción física del alambre para bijouterie, como por ejemplo si es trenzado o sólido y si está recubierto."
    wrist_rest_features:
      name: "Características del apoyamuñecas"
    wrist_rest_type:
      name: "Tipo de apoyamuñecas"
      description: "Identifica el emparejamiento de dispositivo previsto o configuración del conjunto del apoyamuñecas (p. ej., solo teclado, solo mouse, conjuntos combinados)."
    zipper_application:
      name: "Uso del cierre"
      description: "Especifica el proyecto o el uso para el que está diseñado el cierre."
    zipper_chain_type:
      name: "Tipo de cadena del cierre"
      description: "Especifica la construcción/tipo de la cadena/dientes del cierre."
    zipper_end_type:
      name: "Tipo de acabado del cierre"
      description: "Indica cómo termina el cierre y si es de extremo abierto (separable) o de extremo cerrado (no separable), incluyendo hardware común de extremo separador utilizado en los cierres para manualidades."
    zipper_gauge:
      name: "Calibre del cierre"
      description: "Indica el calibre/tamaño de la cadena del cierre, que normalmente se expresa como un número con un # (por ejemplo, #3 o #5), que se correlaciona con el ancho del diente/bobina y el uso previsto."
    zipper_opening_length:
      name: "Longitud de apertura del cierre"
      description: "Define qué parte de la abertura frontal tiene cierre, distinguiendo entre los estilos con cierre completo, de medio cierre o de cuarto de cierre."
    zipper_pull_material:
      name: "Material del tirador del cierre"
      description: "Especifica el material del tirador o lengüeta del cierre (la parte que se agarra), a diferencia de los dientes/cadena y la cinta del cierre."
    zipper_pull_side:
      name: "Lado del tirador del cierre"
      description: "Especifica desde qué lado del cierre se puede acceder a la lengüeta de apertura."
    zipper_pull_strap_cord_tab_material:
      name: "Material de la correa/cordón/pestaña del cierre"
      description: "Material de la correa/cordón/pestaña/borla que se adjunta al tirador del cierre (si lo hay), excluyendo el cuerpo/hardware principal del tirador del cierre."
    zipper_pull_style:
      name: "Estilo de tirador de cierre"
      description: "Describe el diseño o acabado del tirador de un cierre, como texturizado o en relieve."
    zipper_reversibility_mechanism:
      name: "Mecanismo de reversibilidad del cierre"
      description: "Especifica cómo es reversible el cierre (por ejemplo, cursor de doble cara o cursor reversible/de bloqueo automático diseñado para prendas reversibles)."
    zipper_separating_type:
      name: "Tipo de separación del cierre"
      description: "Indica si el cierre se separa en la parte inferior/superior o si es de extremo cerrado, para que sea compatible con camperas, bolsas de dormir, mochilas, etc."
    zipper_side:
      name: "Lado del cierre"
      description: "Indica el lado en el que se encuentra el cierre principal cuando la bolsa de dormir está colocada boca arriba."
    zipper_slider_material:
      name: "Material del deslizador del cierre"
      description: "Especifica el material del deslizador del cierre (el mecanismo móvil), que puede influir en la resistencia y la corrosión."
    zipper_slider_pull_configuration:
      name: "Configuración del deslizador/tirador del cierre"
      description: "Indica si el cierre tiene uno o dos tiradores/deslizadores, y si los tiradores están a uno o ambos lados del deslizador."
    zipper_style:
      name: "Estilo de cierre"
      description: "Indica el largo del cierre o su presencia en la prenda (por ejemplo, sin cierre, con cierre de tres cuartos, con medio cierre, con cierre completo)."
    zipper_tape_material:
      name: "Material de la cinta del cierre"
      description: "Especifica el material principal de la cinta del cierre (laterales de tela) que se cose al proyecto."
    zipper_teeth_type:
      name: "Tipo de dientes del cierre"
      description: "Especifica el estilo de construcción de la cadena/dientes del cierre (por ejemplo, espiral, plástico moldeado, metal, invisible), que afecta a la flexibilidad, la resistencia y la aplicación típica."
