name: Setup
description: Install Node deps, download the pinned Shopify release and install its Ruby toolchain
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm run sync
      shell: bash
    - uses: ruby/setup-ruby@v1
      with:
        working-directory: .upstream/dev
        bundler-cache: true
