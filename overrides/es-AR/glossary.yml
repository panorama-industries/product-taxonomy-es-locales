# Base (es) terms that differ in es-AR. Used by `pnpm run pending --match-glossary` / `--glossary-kept`.
# match: whole-word, case-insensitive forms to find in base text (list every inflection: singular, plural, gender)
# use:   es-AR replacement; note: context, gender changes, exceptions
terms:
  # Clothing
  - match: [prendas de vestir]
    use: ropa
    note: "Category/value names → Ropa (aa-1 is 'Ropa', aa is 'Indumentaria y accesorios'). Keep in running text where natural (telas para prendas de vestir)."
  - match: [falda, faldas]
    use: pollera(s)
    note: "falda pantalón → pollera short. Keep geographic/anatomical sense (falda de montaña) and technical skirts (mask, shuttlecock, balaclava)."
  - match: [calcetín, calcetines]
    use: media(s)
    note: "masc → fem. Ankle socks → soquetes. Hosiery stays 'medias' (use 'medias de nylon' if it must contrast with socks)."
  - match: [pinkis]
    use: medias invisibles
  - match: [sujetador, sujetadores, sostén, sostenes]
    use: corpiño(s)
    note: "masc → masc. Keep 'sostén' in the sense of support (sostén lumbar) and sujetador as fastener/holder/clip."
  - match: [sudadera, sudaderas]
    use: buzo(s)
    note: "fem → masc: sudadera con capucha → buzo con capucha"
  - match: [chaqueta, chaquetas, cazadora, cazadoras]
    use: campera(s)
    note: "Suit, tuxedo, kimono or blazer-style jackets → saco(s). Check en: 'Chaps' was mistranslated as cazadoras (→ zahones)."
  - match: [americana, americanas]
    use: saco(s)
    note: "Only blazer sense; keep nationality adjective."
  - match: [jersey, jerséis, jerseys]
    use: suéter(es) / pulóver(es)
    note: "Keep sports jersey sense → camiseta (de fútbol, etc.), jersey knit fabric and the place name."
  - match: [vaquero, vaqueros, vaquera, vaqueras]
    use: jean(s) / de jean
    note: "Garment/fabric sense only. Cowboy sense: botas vaqueras → botas texanas; keep other cowboy uses."
  - match: [mallas vaqueras]
    use: jeggings
  - match: [malla, mallas]
    use: calza(s) for tights/leggings
    note: "In AR 'malla' = swimsuit. Tights/leggings → calza(s). Keep mesh/net sense (malla metálica, malla de red, malla sombra) and swimsuit sense."
  - match: [leggings, legging]
    use: calza(s)
  - match: [leotardo, leotardos]
    use: malla(s) de gimnasia / body(s)
  - match: [pantalones cortos, pantalón corto]
    use: shorts
    note: "masc pl → masc pl"
  - match: [camiseta, camisetas]
    use: remera(s)
    note: "sin mangas → musculosa(s); interior → camiseta (AR keeps camiseta for undershirts and sports team jerseys: camiseta de fútbol)."
  - match: [polo, polos]
    use: chomba(s)
    note: "Only the shirt. Keep sport (polo), brand names, geographic poles, ice pops, electrical poles."
  - match: [tirante, tirantes]
    use: bretel(es)
    note: "Bra/top straps → breteles; suspenders → tiradores. Keep structural/engineering sense."
  - match: [mono, monos]
    use: enterito(s) / mameluco(s)
    note: "Fashion jumpsuit or baby onesie → enterito; work coveralls/flight suits → mameluco. Keep monkey and audio mono sense."
  - match: [peto]
    use: jardinero (overoles con peto → jardineros)
    note: "Keep armor/sports bib sense."
  - match: [braga, bragas]
    use: bombacha(s)
    note: "Check en: 'Women's Underwear Slips' was mistranslated as bragas (→ combinaciones). Keep 'braga de cuello' → cuello/bandana tubular."
  - match: [bañador, bañadores]
    use: malla(s)
    note: "masc → fem: bañador azul → malla azul"
  - match: [albornoz, albornoces]
    use: bata(s) / salida(s) de baño
  - match: [chándal, chándales]
    use: jogging / conjunto deportivo
  - match: [estar por casa]
    use: estar en casa
  - match: [zapatillas de casa, zapatillas de estar en casa]
    use: pantuflas
  - match: [gafas]
    use: anteojos (de sol) / lentes
    note: "fem pl → masc pl: gafas oscuras → anteojos oscuros. Safety goggles → antiparras."
  - match: [cremallera, cremalleras]
    use: cierre(s)
    note: "fem → masc. Keep gear rack sense (cremallera y piñón)."
  - match: [tacón, tacones]
    use: taco(s)
    note: "masc → masc: zapatos de tacón → zapatos de taco."
  - match: [zapato de salón, zapatos de salón]
    use: stiletto(s) / zapato(s) de taco
    note: "Pump shoes only."
  - match: [botín, botines]
    use: botineta(s) / botita(s)
    note: "In AR 'botines' = soccer cleats (keep that sense). Ankle booties → botinetas; surf/baby booties → botitas/escarpines."
  - match: [patuco, patucos]
    use: escarpín / escarpines
  - match: [chancla, chanclas, chancleta, chancletas]
    use: ojota(s)
    note: "Flip-flop sense."
  - match: [pendiente, pendientes, arete, aretes]
    use: aro(s)
    note: "fem → masc. Earrings only. Keep pending/slope sense (tareas pendientes, pendiente del terreno)."
  - match: [bisutería]
    use: bijouterie
  - match: [abalorio, abalorios]
    use: cuenta(s) / mostacilla(s)
    note: "masc → fem. Beading → mostacillas (agujas para mostacillas)."
  - match: [cartera, carteras]
    use: billetera(s)
    note: "Wallet sense only. In AR 'cartera' = handbag: keep it there."
  - match: [maleta, maletas]
    use: valija(s)
    note: "Luggage category → Valijas y bolsos de viaje. Check en: 'Checked Suitcases' was mistranslated as 'maletas a cuadros' (→ valijas para despachar)."
  - match: [diadema, diademas]
    use: vincha(s)
    note: "Hair headband sense. Keep tiara/crown sense."
  - match: [coleta, coletas]
    use: colita(s) / cola(s) de caballo
    note: "Hairstyle sense. Electrode 'pigtail' connector → cable pigtail."
  - match: [moño, moños]
    use: rodete(s)
    note: "Only the hair bun sense (cubre moño → cubre rodete). Keep bow/ribbon sense, which is the AR meaning."
  - match: [pajarita, pajaritas, corbatín, corbatines]
    use: moño(s)
    note: "Bow tie sense; fem → masc. Keep origami paper bird sense (pajarita de papel)."
  - match: [esmoquin, esmoquines, esmóquines]
    use: smoking(s)
  - match: [gabardina, gabardinas]
    use: piloto(s)
    note: "Trench coat garment only: fem → masc. Keep fabric sense (tela de gabardina)."
  - match: [salopette, salopettes]
    use: jardinero(s)
    note: "Consistent with peto → jardinero."
  - match: [pitillo, pitillos]
    use: chupín (pantalón chupín)
    note: "Skinny trouser fit. Keep cigarette sense if any."
  - match: [pololo, pololos]
    use: bombachudo(s)
    note: "Bloomers worn under skirts/baby bloomers."
  - match: [braguita, braguitas]
    use: bombacha(s) / bombachita(s)
    note: "braguitas de corte alto → bombachas tiro alto"
  - match: [calzón, calzones]
    use: bombacha(s) / calzoncillo(s)
    note: "masc → fem for women's/girls' underpants (bombachas); men's briefs → calzoncillos."
  - match: [pantimedia, pantimedias]
    use: medias de nylon / panty
  - match: [liguero, ligueros]
    use: portaligas
    note: "masc → masc, invariable plural"
  - match: [trabilla, trabillas]
    use: presilla(s)
    note: "Belt loops → presillas para cinturón."
  - match: [quimono, quimonos]
    use: kimono(s)
  - match: [mezclilla]
    use: jean / denim
    note: "fem → masc. Mexicanism for denim fabric."
  - match: [popelina, popelinas]
    use: poplín
    note: "fem → masc"
  - match: [polipiel]
    use: cuero sintético / ecocuero
    note: "fem → masc"
  - match: [ganchillo, ganchillos]
    use: crochet / aguja(s) de crochet
    note: "Technique → crochet; hook tool → aguja de crochet (masc → fem)."
  - match: [calceta]
    use: tejido (de punto)
    note: "Knitting sense (marcadores de calceta → marcadores de tejido)."
  - match: [guateado]
    use: patchwork / acolchado
    note: "Quilting: hilo de guateado → hilo para patchwork."
  - match: [remalladora, remalladoras]
    use: overlock
    note: "máquina overlock"
  # Electronics & home
  - match: [móvil, móviles]
    use: celular(es)
    note: "Phone sense only. Keep 'mobile' adjective (unidad móvil, redes/dispositivos móviles, móvil para cuna, bobina móvil)."
  - match: [ordenador, ordenadores]
    use: computadora(s)
    note: "masc → fem. Ordenador portátil → notebook."
  - match: [portátil, portátiles]
    use: notebook(s) when it's a laptop
    note: "Keep 'portable' adjective sense."
  - match: [nevera, neveras, frigorífico, frigoríficos]
    use: heladera(s)
    note: "Portable cooler → conservadora"
  - match: [grifo, grifos]
    use: canilla(s)
    note: "masc → fem"
  - match: [fregadero, fregaderos]
    use: bacha(s) / pileta(s) de cocina
  - match: [piscina, piscinas]
    use: pileta(s)
  - match: [bombilla, bombillas]
    use: lamparita(s) / foco(s)
    note: "In AR 'bombilla' = mate straw; never use it for light bulbs."
  - match: [mechero, mecheros]
    use: encendedor(es)
  - match: [cubo, cubos]
    use: balde(s)
    note: "Bucket sense only; keep cube sense (cubo de Rubik) and wheel/propeller hub sense. Cubo de basura → tacho de basura."
  - match: [moqueta, moquetas]
    use: alfombra(s) / moquette
  - match: [bolígrafo, bolígrafos]
    use: birome(s) / lapicera(s)
  - match: [coche, coches]
    use: auto(s)
    note: "Baby stroller → cochecito; keep railway car sense (coche cama, coche cabina, coche salón)."
  - match: [aparcamiento, aparcar]
    use: estacionamiento / estacionar
  - match: [tirita, tiritas]
    use: curita(s)
  - match: [biberón, biberones]
    use: mamadera(s)
  - match: [coger]
    use: agarrar / tomar
    note: "Vulgar in AR; never use."
  - match: [lavadora, lavadoras]
    use: lavarropas
    note: "fem → masc (invariable): lavadora-secadora → lavasecarropas. Pressure washer (hidrolavadora) and machines washing non-laundry items (food, plates, carpets) stay."
  - match: [congelador, congeladores]
    use: freezer(s)
    note: "Appliance and fridge compartment (compartimento congelador → freezer)."
  - match: [refrigerador, refrigeradores]
    use: heladera(s)
    note: "masc → fem. Only household/wine fridges. CPU coolers → coolers / refrigeración; beverage tubs → conservadoras."
  - match: [hervidor, hervidores]
    use: pava(s) eléctrica(s) / pava(s)
    note: "masc → fem. Electric kettle → pava eléctrica; stovetop → pava. Kettle grill is not a hervidor: check en."
  - match: [hornillo, hornillos, fogón, fogones]
    use: anafe(s)
    note: "Portable/camping stove sense. In AR 'fogón' = campfire/hearth; keep that sense."
  - match: [cazo, cazos, cacillo, cacillos]
    use: cacerola(s) / jarro(s)
    note: "Saucepan sense; masc → fem for cacerola. Small ladle → cucharón. Climbing hold 'cup pull' → tiradores de cuchara."
  - match: [cubertería]
    use: cubiertos
    note: "fem sg → masc pl: la cubertería desechable → los cubiertos descartables."
  - match: [cucharilla, cucharillas]
    use: cucharita(s)
    note: "Fishing spinner lure → cucharita / spinner."
  - match: [pajita, pajitas, pajilla, pajillas]
    use: sorbete(s)
    note: "fem → masc. 'Paja' has a vulgar meaning in AR; never use for drinking straws."
  - match: [tarro, tarros, tarrina, tarrinas]
    use: frasco(s) / pote(s)
    note: "Jar → frasco; tub → pote. Money jars → alcancías. 'Tarro' is slang in AR."
  - match: [bote, botes]
    use: frasco(s) / tarro(s) / tacho(s)
    note: "Only jar/can sense: botes de galletas → frascos para galletitas; bote de basura → tacho de basura; botes de dinero → alcancías. Keep boat sense (botes de remo)."
  - match: [tapadera, tapaderas]
    use: tapa(s)
  - match: [cubitera, cubiteras]
    use: cubetera(s) / hielera(s)
    note: "Ice cube tray → cubetera; ice bucket → hielera."
  - match: [fiambrera, fiambreras]
    use: vianda(s) / lunchera(s) / táper(s)
    note: "Lunch box. Keep 'fiambre' (cold cuts)."
  - match: [abrebotellas]
    use: destapador(es)
  - match: [escurreplatos]
    use: escurridor(es) de platos / secaplatos
  - match: [pasapurés]
    use: pisapapas
  - match: [salvamanteles]
    use: posafuentes
  - match: [mondadientes, portamondadientes]
    use: escarbadientes / porta escarbadientes
  - match: [palillero, palilleros]
    use: porta escarbadientes
    note: "Toothpick holder sense. Keep chopsticks (palillos chinos)."
  - match: [gofrera, gofreras]
    use: wafflera(s)
  - match: [barreño, barreños]
    use: palangana(s) / fuentón(es)
  - match: [fregona, fregonas]
    use: mopa(s) / lampazo(s)
    note: "Mop heads → repuestos para mopa."
  - match: [bayeta, bayetas]
    use: paño(s) / rejilla(s)
    note: "Dishcloth → repasador / rejilla; dusting pad → paño para el polvo."
  - match: [lejía, lejías]
    use: lavandina(s)
    note: "Bleach sense. Lye sense (curado con lejía) → soda cáustica."
  - match: [lavaplatos]
    use: detergente (para vajilla) / lavavajillas
    note: "Dish soap → detergente; dishwasher machine → lavavajillas."
  - match: [fregable, fregables]
    use: lavable(s)
  - match: [ambientador, ambientadores]
    use: aromatizante(s) / desodorante(s) de ambiente
  - match: [espray, esprays, espráis, esprái]
    use: spray(s) / aerosol(es)
  - match: [bañera, bañeras]
    use: bañadera(s)
  - match: [lavabo, lavabos]
    use: bacha(s) / lavatorio(s)
    note: "masc → fem for bacha. Aircraft lavatory sense → baño."
  - match: [retrete, retretes]
    use: inodoro(s)
  - match: [urinario, urinarios]
    use: mingitorio(s)
  - match: [orinal, orinales, bacinilla, bacinillas]
    use: pelela(s) / chata(s)
    note: "masc → fem. Child potty → pelela; bed pan → chata; male urinal bottle → papagayo."
  - match: [desatascador, desatascadores]
    use: sopapa(s) / destapacañerías
    note: "Plungers → sopapa(s); chemical drain openers → destapacañerías."
  - match: [fontanería]
    use: plomería
  - match: [encimera, encimeras]
    use: mesada(s)
    note: "Kitchen countertop sense."
  - match: [tocador, tocadores]
    use: vanitory / vanitorys
    note: "Bathroom vanity sense only (tocador con lavabo → vanitory con bacha). Keep dressing table sense."
  - match: [armario, armarios, clóset, clósets]
    use: placard(s) / ropero(s) / gabinete(s) / mueble(s)
    note: "Wardrobe → placard or ropero; cabinet (industrial, medical, kitchen) → gabinete or mueble; kitchen wall cabinet → alacena."
  - match: [mesita de noche, mesitas de noche]
    use: mesa(s) de luz
  - match: [cabecero, cabeceros]
    use: respaldo(s)
    note: "Bed headboard sense."
  - match: [somier, somieres]
    use: sommier(s)
    note: "Box springs → sommier de resortes. Futon frame → base para futón."
  - match: [sábana bajera, sábanas bajeras]
    use: sábana(s) ajustable(s)
  - match: [edredón, edredones]
    use: acolchado(s)
  - match: [litera, literas]
    use: cucheta(s)
  - match: [taburete, taburetes]
    use: banqueta(s)
    note: "masc → fem. Step stool → banquito."
  - match: [cojín, cojines]
    use: almohadón / almohadones
    note: "Decorative/seat cushions → almohadón; nursing pillow → almohada de lactancia; technical cushions (mask seal, balance cushion) → almohadilla / disco de equilibrio."
  - match: [alfombrilla, alfombrillas, esterilla, esterillas]
    use: alfombra(s) / felpudo(s) / mouse pad(s) / mat(s)
    note: "Door mat → felpudo; floor/car/bath mat → alfombra; mouse mat → mouse pad; yoga mat → mat de yoga; cutting mat → base de corte; dish drying mat → secaplatos; nap mat → colchoneta. Keep sushi mat (esterilla para sushi) and basketweave."
  - match: [estor, estores]
    use: cortina(s) roller / cortina(s) romana(s)
    note: "masc → fem"
  - match: [suelo, suelos]
    use: piso(s)
    note: "Floor sense only (de suelo → de piso). Keep soil/ground sense (suelo arcilloso, anclaje en el suelo)."
  - match: [parqué]
    use: parquet
  - match: [cristal, cristales]
    use: vidrio(s)
    note: "Ordinary glass (windows, doors, glass arrows) → vidrio; eyewear lenses → lentes. Keep crystal sense (oscilador de cristal, cristal de cuarzo, cristal del reloj, cristalería fina)."
  - match: [limpiacristales]
    use: limpiavidrios
  - match: [barandilla, barandillas]
    use: baranda(s)
  - match: [canalón, canalones]
    use: canaleta(s)
  - match: [cobertizo, cobertizos]
    use: galpón / galpones / tinglado(s)
    note: "Shed sense. Lean-to roof style → techo a un agua."
  - match: [cenador, cenadores]
    use: gazebo(s)
  - match: [barbacoa, barbacoas]
    use: parrilla(s)
    note: "Grill sense. 'Salsa barbacoa' stays."
  - match: [tumbona, tumbonas]
    use: reposera(s)
    note: "Pool float lounger → reposera inflable."
  - match: [hamaca, hamacas]
    use: hamaca(s) paraguaya(s)
    note: "Only hammock sense. In AR 'hamaca' alone = swing / baby bouncer (keep 'hamacas para bebés')."
  - match: [columpio, columpios]
    use: hamaca(s)
    note: "masc → fem."
  - match: [tiesto, tiestos]
    use: maceta(s)
    note: "masc → fem. 'Macetas y tiestos' → 'Macetas y maceteros'."
  - match: [cortacésped, cortacéspedes]
    use: cortadora(s) de césped
  - match: [desbrozadora, desbrozadoras, motoguadaña, motoguadañas, cortabordes]
    use: desmalezadora(s) / bordeadora(s)
    note: "Brush cutter → desmalezadora; string trimmer/edger → bordeadora. Masonry edgers (cortabordes para concreto) stay."
  - match: [farola, farolas]
    use: farol(es) / poste(s) de luz
    note: "fem → masc"
  - match: [acera, aceras]
    use: vereda(s)
  - match: [extintor, extintores]
    use: matafuego(s)
    note: "Noun only. Keep adjective sense: agente extintor."
  - match: [bombona, bombonas]
    use: garrafa(s) / cartucho(s) / bidón(es)
    note: "Large gas cylinder → garrafa; camping gas canister → cartucho; water jug → bidón."
  - match: [garrafa, garrafas]
    use: bidón / bidones
    note: "In AR 'garrafa' = LPG gas cylinder; keep that sense. Fuel cans/jugs → bidones (fem → masc). Beer growlers → growlers."
  - match: [papelera, papeleras]
    use: cesto(s) de papeles / papelero(s)
    note: "fem → masc. Keep 'industria papelera' adjective sense."
  - match: [regleta, regletas]
    use: zapatilla(s) eléctrica(s)
    note: "Power strip sense. Keep terminal block / measuring strip sense (regleta de conexión)."
  - match: [roseta, rosetas]
    use: ficha(s) / toma(s) telefónica(s)
    note: "Phone jack sense only. Keep rosette (decoration) sense."
  - match: [hucha, huchas]
    use: alcancía(s)
  - match: [imperdible, imperdibles]
    use: alfiler(es) de gancho
    note: "Safety pin; fem → masc. Keep adjective sense (unmissable)."
  - match: [cerilla, cerillas]
    use: fósforo(s)
    note: "fem → masc"
  - match: [palé, palés]
    use: pallet(s)
  - match: [taquilla, taquillas]
    use: locker(s) / casillero(s)
    note: "Storage locker sense; keep box-office sense."
  - match: [serrín]
    use: aserrín
  - match: [lechada]
    use: pastina
    note: "Tile grout sense."
  - match: [concreto]
    use: hormigón
    note: "Material sense only. Keep 'concreto' adjective (specific)."
  - match: [raíl, raíles]
    use: riel(es)
  - match: [ruedecilla, ruedecillas]
    use: ruedita(s)
  # Electronics
  - match: [ratón, ratones]
    use: mouse
    note: "Computer mouse only (invariable: los mouse). Alfombrilla de ratón → mouse pad. Keep animal/pest sense."
  - match: [altavoz, altavoces]
    use: parlante(s)
  - match: [mando, mandos]
    use: control(es)
    note: "Remote / game controller: mando a distancia → control remoto; mandos de videojuegos → joysticks / controles. Keep palanca de mando, cabina de mando; handlebar controls → comandos."
  - match: [enrutador, enrutadores]
    use: router(s)
    note: "Network router. Woodworking router → fresadora / router."
  - match: [vídeo, vídeos]
    use: video(s)
    note: "AR spelling without accent."
  - match: [vigilabebés]
    use: monitor(es) para bebés / baby call
  - match: [rocola, rocolas]
    use: rockola(s)
  - match: [monitorización]
    use: monitoreo
    note: "fem → masc"
  # Food
  - match: [fresa, fresas]
    use: frutilla(s)
    note: "Fruit only; milling/dental cutter 'fresa' stays."
  - match: [melocotón, melocotones]
    use: durazno(s)
  - match: [piña, piñas]
    use: ananá(s)
    note: "Fruit only; pine cone (piña de pino) stays."
  - match: [aguacate, aguacates]
